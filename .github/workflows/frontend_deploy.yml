name: Build and Deploy Frontend

on:
  #push:
    #branches: [ "main" ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "832667740061"
  ECR_REPO: frontend
  IMAGE_TAG: ${{ github.run_number }}
  CONTAINER_NAME: frontend
  CONTAINER_PORT: "80"
  HOST_PORT: "80"

jobs:
  build-and-deploy:
    name: Build & Deploy Frontend on EC2
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Build and Push Docker Image
        working-directory: ./frontend
        run: |
          IMAGE_URI="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}"
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Run Frontend Container
        run: |
          docker stop ${{ env.CONTAINER_NAME }} || true
          docker rm ${{ env.CONTAINER_NAME }} || true

          docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            --restart always \
            -p ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }} \
            ${{ env.IMAGE_URI }}

      - name: Verify Container Status
        run: |
          sleep 5
          if [ "$(docker inspect -f '{{.State.Running}}' ${{ env.CONTAINER_NAME }})" = "true" ]; then
            echo "Frontend container is running successfully!"
            exit 0
          else
            echo "Frontend container failed to stay up. Recent logs:"
            docker logs --tail 50 ${{ env.CONTAINER_NAME }}
            exit 1
          fi

      - name: Prune Old Images
        if: always()
        run: |
          docker image prune -f || true
