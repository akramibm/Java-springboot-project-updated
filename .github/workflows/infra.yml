name: "01 - Infrastructure Provisioning (Terraform)"

on:
  push:
    branches:
      - main
    paths:
      - 'terraform-infra/**'
      - '.github/workflows/Infra.yml'
  workflow_dispatch:

permissions:
  id-token: write   # Required for AWS OIDC
  contents: read    # Required to checkout repository
  secrets: write    # Required for Terraform GitHub provider to inject secrets

jobs:
  terraform:
    name: "Terraform Apply & Secrets Injection"
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ./terraform-infra/PRIMARY-US-east-1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false

      - name: Terraform Init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: terraform init

      - name: Terraform Plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: terraform plan -out=tfplan -input=false

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: terraform apply -input=false -auto-approve tfplan