name: "02 - Backend Build & Deploy"

on:
  workflow_run:
    workflows: ["01 - Infrastructure Provisioning (Terraform)"]
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: "Build JAR & Deploy via AWS SSM"
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build with Maven
        working-directory: ./backend
        run: mvn clean package -DskipTests

      - name: Get Artifact Bucket Name from SSM
        id: get-bucket
        run: |
          BUCKET=$(aws ssm get-parameter --name "/app/artifact_bucket" --query "Parameter.Value" --output text)
          echo "bucket=$BUCKET" >> $GITHUB_OUTPUT

      - name: Generate and Upload Deployment Script & Artifact
        run: |
          BUCKET="${{ steps.get-bucket.outputs.bucket }}"
          REGION="${{ secrets.AWS_REGION || 'us-east-1' }}"

          cat << 'SCRIPT' > deploy-backend.sh
          #!/bin/bash
          set -e

          mkdir -p /opt/backend /opt/config

          # Ensure Java is present
          if ! command -v java &> /dev/null; then
            apt-get update -y && apt-get install -y openjdk-17-jdk
          fi

          # Copy JAR from S3
          aws s3 cp "s3://__BUCKET__/backend/datastore-0.0.7.jar" /opt/backend/datastore-0.0.7.jar

          # Fetch DB URL directly using the machine's IMDS/IAM Role
          DB_URL=$(aws ssm get-parameter --name "/app/db_url" --region __REGION__ --query "Parameter.Value" --output text)
          echo "SPRING_DATASOURCE_URL=${DB_URL}" > /opt/config/backend.env

          # Fix permissions
          chown -R ubuntu:ubuntu /opt/backend /opt/config
          chmod 600 /opt/config/backend.env

          # Create systemd unit using EnvironmentFile
          cat << 'UNIT' > /etc/systemd/system/backend.service
          [Unit]
          Description=Spring Boot Zero-Touch Backend
          After=network.target

          [Service]
          User=ubuntu
          WorkingDirectory=/opt/backend
          EnvironmentFile=/opt/config/backend.env
          ExecStart=/usr/bin/java -jar /opt/backend/datastore-0.0.7.jar
          SuccessExitStatus=143
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
          UNIT

          systemctl daemon-reload
          systemctl enable backend.service

          echo "Attempting to restart backend.service..."
          if ! systemctl restart backend.service; then
            echo "=== SYSTEMD FAILED: Service Status ==="
            systemctl status backend.service --no-pager
            echo "=== SYSTEMD FAILED: Journalctl Logs ==="
            journalctl -u backend.service -n 100 --no-pager
            exit 1
          fi

          sleep 5
          if ! systemctl is-active --quiet backend.service; then
            echo "=== Backend is not active after starting ==="
            journalctl -u backend.service -n 100 --no-pager
            exit 1
          fi

          echo "Backend service is active and running."
          SCRIPT

          sed -i "s|__BUCKET__|${BUCKET}|g" deploy-backend.sh
          sed -i "s|__REGION__|${REGION}|g" deploy-backend.sh

          aws s3 cp backend/target/datastore-0.0.7.jar "s3://${BUCKET}/backend/datastore-0.0.7.jar"
          aws s3 cp deploy-backend.sh "s3://${BUCKET}/scripts/deploy-backend.sh"

      - name: Trigger SSM Execution
        run: |
          BUCKET="${{ steps.get-bucket.outputs.bucket }}"
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Role,Values=three-tier-app" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "Error: No running EC2 instance found with tag Role=three-tier-app."
            exit 1
          fi

          echo "Target Instance: $INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Execute backend deployment script" \
            --parameters commands="[\"aws s3 cp s3://${BUCKET}/scripts/deploy-backend.sh /tmp/deploy-backend.sh\",\"bash /tmp/deploy-backend.sh\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID. Polling execution..."

          for i in {1..40}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Status ($i/40): $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "=== Deployment Succeeded ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "=== Standard Error ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text
              echo "=== Standard Output ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
              exit 1
            fi
            sleep 5
          done

          echo "SSM execution timed out."
          exit 1