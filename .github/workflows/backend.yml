name: "02 - Backend Build & Deploy"

on:
  workflow_run:
    workflows: ["01 - Infrastructure Provisioning (Terraform)"]
    types:
      - completed
  push:
    # branches:
    #   - main
    # paths:
    #   - 'backend/**'
    #   - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  id-token: write   # AWS OIDC authentication
  contents: read

jobs:
  build-and-deploy:
    name: "Build JAR & Deploy via AWS SSM"
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build with Maven
        working-directory: ./backend
        run: mvn clean package -DskipTests

      - name: Get Artifact Bucket Name from SSM
        id: get-bucket
        run: |
          BUCKET=$(aws ssm get-parameter --name "/app/artifact_bucket" --query "Parameter.Value" --output text)
          echo "bucket=$BUCKET" >> $GITHUB_OUTPUT

      - name: Upload JAR to S3
        run: |
          aws s3 cp backend/target/datastore-0.0.7.jar s3://${{ steps.get-bucket.outputs.bucket }}/backend/datastore-0.0.7.jar

      - name: Deploy via SSM Run Command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=tag:Role,Values=three-tier-app" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Spring Boot Backend JAR" \
            --parameters 'commands=[
              "aws s3 cp s3://${{ steps.get-bucket.outputs.bucket }}/backend/datastore-0.0.7.jar /opt/backend/datastore-0.0.7.jar",
              "chown ubuntu:ubuntu /opt/backend/datastore-0.0.7.jar",
              "systemctl restart backend.service",
              "systemctl is-active --quiet backend.service"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command sent: $COMMAND_ID. Waiting for execution..."
          sleep 10
          INSTANCE_ID=$(aws ec2 describe-instances --filters "Name=tag:Role,Values=three-tier-app" "Name=instance-state-name,Values=running" --query "Reservations[0].Instances[0].InstanceId" --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          echo "Backend successfully deployed via SSM!"