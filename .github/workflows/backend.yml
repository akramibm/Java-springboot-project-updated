name: "02 - Backend Build & Deploy"

on:
  workflow_run:
    workflows: ["01 - Infrastructure Provisioning (Terraform)"]
    types:
      - completed
  push:
    # branches:
    #   - main
    # paths:
    #   - 'backend/**'
    #   - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  id-token: write   # AWS OIDC STS token exchange
  contents: read

jobs:
  build-and-deploy:
    name: "Build JAR & Deploy via AWS SSM"
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build with Maven
        working-directory: ./backend
        run: mvn clean package -DskipTests

      - name: Get Artifact Bucket Name from SSM
        id: get-bucket
        run: |
          BUCKET=$(aws ssm get-parameter --name "/app/artifact_bucket" --query "Parameter.Value" --output text)
          echo "bucket=$BUCKET" >> $GITHUB_OUTPUT

      - name: Upload JAR to S3
        run: |
          aws s3 cp backend/target/datastore-0.0.7.jar s3://${{ steps.get-bucket.outputs.bucket }}/backend/datastore-0.0.7.jar

      - name: Deploy via SSM Run Command
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Role,Values=three-tier-app" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "Error: No running EC2 instance found with tag Role=three-tier-app."
            exit 1
          fi

          echo "Target Instance ID: $INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Spring Boot Backend JAR & Configure Unit" \
            --parameters 'commands=[
              "mkdir -p /opt/backend /opt/config",
              "chown -R ubuntu:ubuntu /opt/backend /opt/config",
              "which java || apt-get update -y && apt-get install -y openjdk-17-jdk",
              "aws s3 cp s3://${{ steps.get-bucket.outputs.bucket }}/backend/datastore-0.0.7.jar /opt/backend/datastore-0.0.7.jar",
              "chown ubuntu:ubuntu /opt/backend/datastore-0.0.7.jar",
              "cat << '\''SERVICE'\'' > /etc/systemd/system/backend.service
[Unit]
Description=Spring Boot Zero-Touch Backend
After=network.target

[Service]
User=ubuntu
WorkingDirectory=/opt/backend
ExecStartPre=/bin/bash -c '\''aws ssm get-parameter --name \"/app/db_url\" --region ${{ secrets.AWS_REGION || '\''us-east-1'\'' }} --query \"Parameter.Value\" --output text > /opt/config/db_url.env'\''
ExecStart=/bin/bash -c '\''export SPRING_DATASOURCE_URL=$(cat /opt/config/db_url.env); exec /usr/bin/java -Dspring.datasource.url=$SPRING_DATASOURCE_URL -jar /opt/backend/datastore-0.0.7.jar'\''
SuccessExitStatus=143
Restart=always
RestartSec=10

[Install]
WantedBy=multi-user.target
SERVICE",
              "systemctl daemon-reload",
              "systemctl enable backend.service",
              "systemctl restart backend.service",
              "sleep 8",
              "systemctl is-active --quiet backend.service || (journalctl -u backend.service -n 50 --no-pager && exit 1)"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID. Polling execution status..."

          for i in {1..40}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Status ($i/40): $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "=== Backend Deployment Succeeded ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "=== Command Failed! Standard Error Output ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text
              echo "=== Standard Output Content ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
              exit 1
            fi

            sleep 5
          done

          echo "Error: SSM Command execution timed out after waiting."
          exit 1