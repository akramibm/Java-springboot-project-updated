name: "03 - Frontend Deploy"

on:
workflow_run:
workflows: ["02 - Backend Build & Deploy"]
types:
  - completed
push:
branches:
  - main
paths:
  - 'frontend/**'
  - '.github/workflows/frontend.yml'
workflow_dispatch:

permissions:
id-token: write
contents: read

jobs:
deploy-frontend:
name: "Deploy Frontend via AWS SSM"
runs-on: ubuntu-latest
if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Configure AWS Credentials via OIDC
    uses: aws-actions/configure-aws-credentials@v4
    with:
      role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
      audience: sts.amazonaws.com

  - name: Get Artifact Bucket Name from SSM
    id: get-bucket
    run: |
      BUCKET=$(aws ssm get-parameter --name "/app/artifact_bucket" --query "Parameter.Value" --output text)
      echo "bucket=$BUCKET" >> $GITHUB_OUTPUT

  - name: Sync Frontend Code to S3
    run: |
      aws s3 sync frontend/ s3://${{ steps.get-bucket.outputs.bucket }}/frontend/ --delete

  - name: Execute Deployment via SSM
    run: |
      BUCKET="${{ steps.get-bucket.outputs.bucket }}"
      INSTANCE_ID=$(aws ec2 describe-instances \
        --filters "Name=tag:Role,Values=three-tier-app" "Name=instance-state-name,Values=running" \
        --query "Reservations[0].Instances[0].InstanceId" \
        --output text)

      if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
        echo "Error: No running EC2 instance found with tag Role=three-tier-app."
        exit 1
      fi

      echo "Target Instance: $INSTANCE_ID"

      COMMAND_ID=$(aws ssm send-command \
        --instance-ids "$INSTANCE_ID" \
        --document-name "AWS-RunShellScript" \
        --comment "Execute frontend deployment script" \
        --parameters commands="[\"aws s3 sync s3://${BUCKET}/frontend/ /opt/frontend/ --delete\",\"bash /opt/frontend/deploy-frontend.sh\"]" \
        --query "Command.CommandId" \
        --output text)

      echo "Command ID: $COMMAND_ID. Polling execution..."

      for i in {1..40}; do
        STATUS=$(aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "$INSTANCE_ID" \
          --query "Status" \
          --output text 2>/dev/null || echo "Pending")

        echo "Status ($i/40): $STATUS"

        if [ "$STATUS" = "Success" ]; then
          echo "=== Frontend Deployment Succeeded ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
          exit 0
        elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
          echo "=== Command Failed! Standard Error Output ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text
          echo "=== Standard Output Content ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
          exit 1
        fi
        sleep 5
      done

      echo "Error: SSM Command execution timed out."
      exit 1
