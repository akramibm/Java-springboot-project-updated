name: "03 - Frontend Deploy"

on:
  workflow_run:
    workflows: ["02 - Backend Build & Deploy"]
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-frontend:
    name: "Deploy Frontend via AWS SSM"
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: Get Artifact Bucket Name from SSM
        id: get-bucket
        run: |
          BUCKET=$(aws ssm get-parameter --name "/app/artifact_bucket" --query "Parameter.Value" --output text)
          echo "bucket=$BUCKET" >> $GITHUB_OUTPUT

      - name: Sync Frontend Code to S3
        run: |
          aws s3 sync frontend/ s3://${{ steps.get-bucket.outputs.bucket }}/frontend/ --delete --exclude "venv/*" --exclude "__pycache__/*"

      - name: Execute Deployment via SSM
        run: |
          BUCKET="${{ steps.get-bucket.outputs.bucket }}"
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Role,Values=three-tier-app" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "Error: No running EC2 instance found with tag Role=three-tier-app."
            exit 1
          fi

          echo "Target Instance: $INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Zero-touch Streamlit websocket and Nginx configuration" \
            --parameters "commands=[
              \"which python3 &>/dev/null || (apt-get update -y && apt-get install -y python3 python3-pip python3-venv nginx)\",
              \"printf 'map \\$http_upgrade \\$connection_upgrade {\\n    default upgrade;\\n    \\\\'\\\\\\' close;\\n}\\n\\nserver {\\n    listen 80 default_server;\\n    listen [::]:80 default_server;\\n\\n    location / {\\n        proxy_pass http://127.0.0.1:5000;\\n        proxy_http_version 1.1;\\n        proxy_set_header Upgrade \\$http_upgrade;\\n        proxy_set_header Connection \\$connection_upgrade;\\n        proxy_set_header Host \\$host;\\n        proxy_set_header X-Real-IP \\$remote_addr;\\n        proxy_set_header X-Forwarded-For \\$proxy_add_x_forwarded_for;\\n        proxy_set_header X-Forwarded-Proto \\$scheme;\\n        proxy_buffering off;\\n        proxy_read_timeout 86400s;\\n        proxy_send_timeout 86400s;\\n    }\\n\\n    location ^~ /_stcore/stream {\\n        proxy_pass http://127.0.0.1:5000/_stcore/stream;\\n        proxy_http_version 1.1;\\n        proxy_set_header Upgrade \\$http_upgrade;\\n        proxy_set_header Connection \\$connection_upgrade;\\n        proxy_set_header Host \\$host;\\n        proxy_buffering off;\\n        proxy_read_timeout 86400s;\\n        proxy_send_timeout 86400s;\\n    }\\n\\n    location /api/ {\\n        proxy_pass http://127.0.0.1:8080/;\\n        proxy_set_header Host \\$host;\\n        proxy_set_header X-Real-IP \\$remote_addr;\\n        proxy_set_header X-Forwarded-For \\$proxy_add_x_forwarded_for;\\n    }\\n}\\n' > /etc/nginx/sites-available/default\",
              \"nginx -t && systemctl restart nginx\",
              \"mkdir -p /opt/frontend /opt/frontend-venv\",
              \"aws s3 sync s3://${BUCKET}/frontend/ /opt/frontend/ --delete --exclude 'venv/*'\",
              \"if [ ! -f /opt/frontend-venv/bin/pip ]; then rm -rf /opt/frontend-venv && python3 -m venv /opt/frontend-venv; fi\",
              \"if [ -f /opt/frontend/requirements.txt ]; then /opt/frontend-venv/bin/pip install --upgrade pip && /opt/frontend-venv/bin/pip install -r /opt/frontend/requirements.txt; fi\",
              \"printf '[Unit]\\nDescription=Streamlit Frontend Service\\nAfter=network.target\\n\\n[Service]\\nUser=ubuntu\\nWorkingDirectory=/opt/frontend\\nExecStart=/opt/frontend-venv/bin/streamlit run app.py --server.port 5000 --server.address 127.0.0.1 --server.headless true --server.enableCORS false --server.enableXsrf false\\nRestart=always\\nRestartSec=5\\n\\n[Install]\\nWantedBy=multi-user.target\\n' > /etc/systemd/system/frontend.service\",
              \"chown -R ubuntu:ubuntu /opt/frontend /opt/frontend-venv\",
              \"systemctl daemon-reload && systemctl enable frontend.service && systemctl restart frontend.service\",
              \"sleep 5\",
              \"systemctl is-active --quiet frontend.service || (journalctl -u frontend.service -n 50 --no-pager && exit 1)\",
              \"ss -tulpn | grep 5000 || (echo 'Port 5000 not listening' && exit 1)\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID. Polling execution..."

          for i in {1..40}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Status ($i/40): $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "=== Streamlit Frontend Deployment Succeeded ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "=== Command Failed! Standard Error Output ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text
              echo "=== Standard Output Content ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
              exit 1
            fi
            sleep 5
          done

          echo "Error: SSM Command execution timed out."
          exit 1
