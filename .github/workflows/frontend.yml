name: "03 - Frontend Deploy"

on:
  workflow_run:
    workflows: ["02 - Backend Build & Deploy"]
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-frontend:
    name: "Deploy Frontend via AWS SSM"
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: Get Artifact Bucket Name from SSM
        id: get-bucket
        run: |
          BUCKET=$(aws ssm get-parameter --name "/app/artifact_bucket" --query "Parameter.Value" --output text)
          echo "bucket=$BUCKET" >> $GITHUB_OUTPUT

      - name: Generate and Upload Frontend Code & Deployment Script
        run: |
          BUCKET="${{ steps.get-bucket.outputs.bucket }}"

          # Sync source files to S3
          aws s3 sync frontend/ "s3://${BUCKET}/frontend/" --delete

          # Generate clean zero-touch deployment script
          cat << 'SCRIPT' > deploy-frontend.sh
          #!/bin/bash
          set -e

          mkdir -p /opt/frontend

          # Sync from S3
          aws s3 sync "s3://__BUCKET__/frontend/" /opt/frontend/ --delete

          # Configure Nginx reverse proxy
          cat << 'NGINX' > /etc/nginx/sites-available/default
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
NGINX

          nginx -t
          systemctl restart nginx

          # Setup Python venv and dependencies
          cd /opt/frontend
          if [ ! -d venv ]; then
            python3 -m venv venv
          fi
          if [ -f requirements.txt ]; then
            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt
          fi

          # Configure systemd unit
          cat << 'UNIT' > /etc/systemd/system/frontend.service
[Unit]
Description=Python Frontend Service
After=network.target

[Service]
User=ubuntu
WorkingDirectory=/opt/frontend
ExecStart=/opt/frontend/venv/bin/python app.py
Restart=always
RestartSec=5

[Install]
WantedBy=multi-user.target
UNIT

          chown -R ubuntu:ubuntu /opt/frontend
          systemctl daemon-reload
          systemctl enable frontend.service
          systemctl restart frontend.service

          sleep 4
          systemctl is-active --quiet frontend.service || (journalctl -u frontend.service -n 50 --no-pager && exit 1)
          SCRIPT

          sed -i "s|__BUCKET__|${BUCKET}|g" deploy-frontend.sh
          aws s3 cp deploy-frontend.sh "s3://${BUCKET}/scripts/deploy-frontend.sh"

      - name: Execute Deployment via SSM
        run: |
          BUCKET="${{ steps.get-bucket.outputs.bucket }}"
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Role,Values=three-tier-app" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "Error: No running EC2 instance found with tag Role=three-tier-app."
            exit 1
          fi

          echo "Target Instance: $INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Execute frontend deployment script" \
            --parameters commands="[\"aws s3 cp s3://${BUCKET}/scripts/deploy-frontend.sh /tmp/deploy-frontend.sh\",\"bash /tmp/deploy-frontend.sh\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID. Polling execution..."

          for i in {1..40}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Status ($i/40): $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "=== Frontend Deployment Succeeded ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "=== Command Failed! Standard Error Output ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text
              echo "=== Standard Output Content ==="
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
              exit 1
            fi
            sleep 5
          done

          echo "Error: SSM Command execution timed out."
          exit 1
