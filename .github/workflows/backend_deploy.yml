name: Build and Deploy Backend

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "832667740061"
  ECR_REPO: backend
  IMAGE_TAG: ${{ github.run_number }}
  CONTAINER_NAME: backend
  CONTAINER_PORT: "8084"
  RDS_HOST: database-1.c8lweogi44to.us-east-1.rds.amazonaws.com

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.set-image.outputs.image_uri }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Image URI Output
        id: set-image
        run: |
          echo "image_uri=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
          cache: 'maven'

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build JAR with Maven
        working-directory: ./backend
        run: |
          mvn clean package -DskipTests

      - name: Build and Push Docker Image
        working-directory: ./backend
        run: |
          IMAGE_URI="${{ steps.set-image.outputs.image_uri }}"
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    # If running a self-hosted runner directly on your EC2 instance:
    runs-on: self-hosted
    
    # (If using GitHub-hosted runners with SSH instead, swap runner to ubuntu-latest and use SSH action)
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy Container
        run: |
          IMAGE_URI="${{ needs.build-and-push.outputs.image_uri }}"

          # Stop and remove existing container
          docker stop ${{ env.CONTAINER_NAME }} || true
          docker rm ${{ env.CONTAINER_NAME }} || true

          # Pull the newly pushed image
          docker pull $IMAGE_URI

          # Run new container
          docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            --restart always \
            -p ${{ env.CONTAINER_PORT }}:${{ env.CONTAINER_PORT }} \
            -e MYSQL_HOST=${{ env.RDS_HOST }} \
            -e MYSQL_PORT=3306 \
            -e MYSQL_USERNAME=admin \
            -e MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }} \
            $IMAGE_URI

      - name: Health Check
        run: |
          echo "Waiting for Spring Boot backend to boot up..."
          for i in {1..30}; do
            if curl -s -f http://localhost:${{ env.CONTAINER_PORT }}/actuator/health; then
              echo -e "\nApplication is healthy!"
              exit 0
            fi
            echo "Waiting for app to start... (attempt $i/30)"
            sleep 3
          done

          echo "Health check failed! Fetching logs:"
          docker logs --tail 50 ${{ env.CONTAINER_NAME }}
          exit 1

      - name: Clean up unused Docker layers
        if: always()
        run: |
          docker image prune -f || true
